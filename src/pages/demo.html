<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live demo — the Yarta dashboard, by sector</title>
<meta name="description" content="The Yarta environmental sustainability dashboard on demo data: pick a sector, see the score, the categories, the figures behind them and the roadmap to improvement, and book help.">
<meta name="theme-color" content="#0B0B0B">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/yarta/yes.css">
<link rel="stylesheet" href="/assets/yarta/portal.css">
<link rel="stylesheet" href="/assets/yarta/yarta.css">
</head>
<body class="page-portal page-yarta page-demo-portal">
<header class="ytop no-print">
  <a class="ylogo" href="/"><img src="/assets/yarta/yarta-logo.webp" alt="Yarta" width="66" height="72"><span><b>Yarta</b>Environmental Sustainability · live demo</span></a>
  <div class="yacts">
    <span class="ydemo">Demo data · fictional organisations · nothing is sent</span>
    <a class="btn btn-ink btn-sm" href="/report/">The sample report</a>
    <a class="btn btn-ghost btn-sm" href="/contact/">Talk to Yarta</a>
  </div>
</header>
<div class="sector-strip no-print" aria-label="Choose a sector">
  <div class="sector-wrap"><span class="sector-k">See the demo as</span><div class="sector-chips" id="sectors"></div></div>
</div>
<div id="app"></div>
<script src="/assets/yarta/dictionary.js"></script>
<script src="/assets/yarta/engine.js"></script>
<script src="/assets/yarta/demo-data.js"></script>
<script src="/assets/yarta/recommend.js"></script>
<script src="/assets/yarta/sectors.js"></script>
<script src="/assets/yarta/benchmarks.js"></script>
<script src="/assets/yarta/portal.js"></script>
<script>
(function(){
  var P=window.YESPortal, S=window.YESS, chips=document.getElementById('sectors');
  function pick(){ var q=/[?&]sector=([a-z]+)/.exec(location.search); if(q && S.BY[q[1]]) return q[1]; var cur=P.currentOrgId(); var s=cur && S.forOrg(cur); return s ? s.k : 'council'; }
  function mark(){ var cur=P.currentOrgId(), s=cur && S.forOrg(cur); Array.prototype.forEach.call(chips.querySelectorAll('button'),function(b){ b.setAttribute('aria-pressed', s && b.getAttribute('data-k')===s.k ? 'true':'false'); }); }
  chips.innerHTML=S.SECTORS.map(function(s){ return '<button type="button" data-k="'+s.k+'" aria-pressed="false">'+s.name+'</button>'; }).join('');
  chips.addEventListener('click',function(e){ var b=e.target.closest('button[data-k]'); if(!b) return; var k=b.getAttribute('data-k'); P.signInAs(S.BY[k].org,'#/dashboard'); if(history.replaceState) history.replaceState(null,'',location.pathname+'?sector='+k+location.hash); mark(); });
  var k=pick(); var cur=P.currentOrgId(), curSec=cur && S.forOrg(cur);
  if(!cur || !curSec || curSec.k!==k || !location.hash || location.hash==='#/') P.signInAs(S.BY[k].org, location.hash && location.hash!=='#/' ? location.hash : '#/dashboard');
  mark();
  window.addEventListener('hashchange', mark);
  document.addEventListener('click', function(e){ if(e.target.closest('[data-act="signout"]')){ setTimeout(function(){ P.signInAs(S.BY[pick()].org,'#/dashboard'); mark(); },0); } });
})();
</script>
</body>
</html>
